<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>óga</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div id="app" class="dither">

    <!-- ─── Clima (superior izquierda) ─── -->
    <div id="weather" class="top-left">
      <div id="weather-icon" class="wi-icon"></div>
      <div id="weather-info">
        <span id="weather-temp">--°</span>
        <span id="weather-city"></span>
      </div>
    </div>

    <!-- ─── Fecha + Saludo (superior derecha) ─── -->
    <div id="greeting-area" class="top-right">
      <span id="date"></span>
      <span id="greeting"></span>
    </div>

    <!-- ─── Hora + Búsqueda + Links rápidos (centro) ─── -->
    <div id="center-area">
      <div id="clock-time">--:--</div>
      <div id="search-bar">
        <input type="text" id="search-input" placeholder="Buscar en la web…" spellcheck="false" autocomplete="off">
      </div>
      <div id="quick-links"></div>
    </div>

    <!-- ─── Now Playing (inferior izquierda) ─── -->
    <div id="nowplaying" class="idle">
      <div id="np-wave" aria-hidden="true"><span></span><span></span><span></span></div>
      <span id="np-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="5" cy="15" r="2.5"/><circle cx="15" cy="13" r="2.5"/><path d="M7.5 13V3l10-1.5v11"/></svg></span>
      <span id="np-track"></span>
    </div>
    <!-- ─── Frase del día (inferior centro) ─── -->
    <div id="phrase"></div>

    <!-- ─── Pomodoro + Pestañas + Toggle (inferior derecha) ─── -->
    <div id="bottom-tools">
      <div class="pomo-group">
        <span id="pomodoro-time"></span>
        <button id="pomodoro-btn" aria-label="Pomodoro">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle id="pomodoro-bg" cx="11" cy="11" r="9"/>
            <circle id="pomodoro-fg" cx="11" cy="11" r="9" stroke-dasharray="56.52" stroke-dashoffset="0"/>
          </svg>
        </button>
      </div>
      <button id="theme-toggle" aria-label="Alternar modo oscuro">
        <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button id="settings-btn" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <circle cx="5" cy="5" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="19" cy="5" r="1.5"/>
          <circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>
          <circle cx="5" cy="19" r="1.5"/><circle cx="12" cy="19" r="1.5"/><circle cx="19" cy="19" r="1.5"/>
        </svg>
      </button>
    </div>

    <!-- ─── Panel de ajustes ─── -->
    <div id="settings-overlay" class="hidden">
      <div id="settings-panel">
        <div id="settings-header">
          <span>ajustes</span>
          <button id="settings-close" aria-label="Cerrar">✕</button>
        </div>
        <div id="settings-body"></div>
      </div>
    </div>

  </div>
  <script src="newtab.js"></script>
</body>
</html>
